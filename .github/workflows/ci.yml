# Build and test checks. Hosted runners are free for public repositories; if this
# repository becomes private, macOS minutes count against the account's Actions quota.
name: CI

on:
  # Pull requests run once per push; main runs after each merge. (Pushing to a work branch
  # without a PR no longer starts a second, identical run.)
  push:
    branches: ["main"]
    # Documentation-only pushes do not rebuild (and do not cancel a running build).
    paths-ignore: ["docs/**", "**/*.md", "RENN_AGENT_HANDOFF/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: RENNCore tests (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test pure domain, features and fakes
        run: swift test --package-path Packages/RENNCore

  localization:
    name: String Catalog check (all languages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_localization.py
      - name: Release readiness audit (informational)
        run: python3 scripts/release_audit.py

  ios:
    name: iOS app build and simulator tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | grep -vi rc | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Pick and boot an iPhone simulator (boots while the app builds)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")], reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('RENN.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build app and tests once, for the booted simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project RENN.xcodeproj -scheme RENN -configuration Debug \
            -destination "id=$UDID" \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Show resolved package versions
        run: cat RENN.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || echo "No Package.resolved"
      - name: Run app tests on the simulator (no rebuild)
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test-without-building \
            -project RENN.xcodeproj -scheme RENN \
            -destination "id=$UDID" \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tee test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          if-no-files-found: ignore
